backend:
  name: github
  repo: LPOregon/lpmultco
  branch: main

media_folder: "assets/images"
public_folder: "/assets/images"

collections:

  # News posts — create/edit via the CMS UI
  - name: "posts"
    label: "News & Announcements"
    folder: "_posts"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - {label: "Title", name: "title", widget: "string"}
      - {label: "Date", name: "date", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false}
      - {label: "External link (optional)", name: "link", widget: "string", required: false, pattern: ["^https?://.+", "Must start with http:// or https://"], hint: "If set, the news card links straight here instead of to a post page. Good for newsletter posts."}
      - {label: "Body", name: "body", widget: "markdown"}

  # Site settings — officers, meetup info, resources
  - name: "settings"
    label: "Site Settings"
    files:
      - name: "site"
        label: "Officers, Meetup & Resources"
        file: "_data/site.yml"
        fields:
          - label: "Officers"
            name: "officers"
            widget: "list"
            fields:
              - {label: "Name", name: "name", widget: "string"}
              - {label: "Role", name: "role", widget: "string"}
          - label: "Meetup Details"
            name: "meetup"
            widget: "object"
            fields:
              - {label: "Location Name", name: "location", widget: "string"}
              - {label: "Address", name: "address", widget: "string"}
              - {label: "Time", name: "time", widget: "string"}
              - {label: "Schedule", name: "day", widget: "string", hint: "e.g. once a month"}
              - {label: "Welcome Note", name: "notes", widget: "text"}
              - {label: "First Meeting Blurb", name: "first_visit", widget: "text", required: false, hint: "Shown under the RSVP button as 'Your first meeting'. Markdown allowed. Leave empty to hide."}
              - label: "Luma Event ID"
                name: luma_event_id
                widget: string
                required: false
                hint: "Internal Luma event ID. Get it from: Manage event → More tab → Embed Registration Button. Format: evt-XXXXXXXXXXXXXXXXX"
              - label: "Next Event Date"
                name: luma_next_date
                widget: string
                required: false
                hint: "Display date for the next event card, e.g. 'April 5, 2026'. Update monthly alongside the event ID."
          - label: "Resources"
            name: "resources"
            widget: "list"
            fields:
              - {label: "Name", name: "name", widget: "string"}
              - {label: "URL", name: "url", widget: "string"}
              - {label: "Description", name: "description", widget: "string"}
