meetup:
  location: Dick's Primal Burger
  address: 4905 SE Woodstock Blvd, Portland, OR 97206
  time: 4:00 PM
  day: once a month
  notes: Grab a burger and join fellow Libertarians as we work to spread liberty through the Portland area! All peaceful people are welcome. You don't need to be a Multnomah County resident or registered Libertarian to join meetings.
  first_visit: Never been to a political meeting? Ours is casual. Grab food at the counter, find the Libertarian table, and introduce yourself — nobody will quiz you on ideology. Come with questions, come with opinions, or just come to listen. You don't need to be a member, a registered Libertarian, or a Multnomah County resident.
  luma_event_id: evt-9DuwMPf01yeph1V
  luma_next_date: December 5, 2026
